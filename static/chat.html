<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital Appointment Assistant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: #f0f2f5; color: #1c1e21; display: flex; flex-direction: column; height: 100vh; }
  header { background: #0066cc; color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 1.15rem; font-weight: 600; }
  header button { background: #ffffff22; color: #fff; border: 1px solid #ffffff55; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
  header button:hover { background: #ffffff44; }
  .container { display: flex; flex: 1; overflow: hidden; }
  .chat-pane { display: flex; flex-direction: column; flex: 1; background: #fff; }
  .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 75%; padding: 10px 14px; border-radius: 8px; line-height: 1.45; font-size: 0.95rem; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #0066cc; color: #fff; }
  .msg.assistant { align-self: flex-start; background: #e9ecef; color: #212529; }
  .typing { align-self: flex-start; font-style: italic; color: #6c757d; font-size: 0.85rem; }
  .input-bar { display: flex; padding: 12px; border-top: 1px solid #dee2e6; gap: 8px; background: #fff; }
  .input-bar input { flex: 1; padding: 10px 12px; border: 1px solid #ced4da; border-radius: 4px; font-size: 0.95rem; }
  .input-bar button { padding: 10px 18px; background: #0066cc; color: #fff; border: none; border-radius: 4px; font-weight: 500; cursor: pointer; }
  .input-bar button:disabled { background: #a0c4eb; cursor: not-allowed; }
  .debug-pane { width: 380px; border-left: 1px solid #dee2e6; background: #fafbfc; display: flex; flex-direction: column; }
  .debug-header { padding: 10px 14px; font-weight: 600; font-size: 0.85rem; border-bottom: 1px solid #dee2e6; background: #eef1f5; cursor: pointer; display: flex; justify-content: space-between; }
  .debug-content { flex: 1; overflow-y: auto; padding: 12px; font-size: 0.8rem; font-family: monospace; }
  .debug-content h4 { margin: 8px 0 4px; font-size: 0.85rem; }
  pre { background: #f1f3f5; padding: 8px; border-radius: 4px; overflow-x: auto; margin-bottom: 10px; }
  @media (max-width: 800px) {
    .container { flex-direction: column; }
    .debug-pane { width: 100%; height: 220px; border-left: none; border-top: 1px solid #dee2e6; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">CityCare Hospital</h1>
  <div>
    <button id="new-chat-btn" onclick="startNewChat()">New chat</button>
    <a href="/admin" target="_blank" style="color:#fff;margin-left:10px;text-decoration:none;font-size:0.9rem;">Admin</a>
  </div>
</header>
<div class="container">
  <div class="chat-pane">
    <div class="messages" id="messages"></div>
    <div class="input-bar">
      <input type="text" id="user-input" placeholder="Type your message..." onkeydown="if(event.key==='Enter')sendMessage()">
      <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>
  <div class="debug-pane">
    <div class="debug-header" onclick="toggleDebug()">
      <span>Agent State & Tool Trace</span>
      <span id="debug-toggle-arrow">▼</span>
    </div>
    <div class="debug-content" id="debug-content">
      <h4>Latest Booking Output:</h4>
      <pre id="debug-data">No data yet</pre>
      <h4>Latest Tool Call Trace:</h4>
      <pre id="debug-trace">No tool calls yet</pre>
    </div>
  </div>
</div>
<script>
  let sessionId = localStorage.getItem("chat_session_id") || crypto.randomUUID();
  localStorage.setItem("chat_session_id", sessionId);

  function appendMessage(role, text) {
    const list = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.textContent = text;
    list.appendChild(div);
    list.scrollTop = list.scrollHeight;
  }

  async function loadConfig() {
    try {
      const res = await fetch("/api/public-config");
      if (res.ok) {
        const data = await res.json();
        document.getElementById("title").textContent = data.clinic_name;
        if (document.getElementById("messages").children.length === 0) {
          appendMessage("assistant", data.welcome_message);
        }
      }
    } catch (e) {
      console.error(e);
    }
  }

  function startNewChat() {
    sessionId = crypto.randomUUID();
    localStorage.setItem("chat_session_id", sessionId);
    document.getElementById("messages").innerHTML = "";
    document.getElementById("debug-data").textContent = "New session started";
    document.getElementById("debug-trace").textContent = "No tool calls yet";
    loadConfig();
  }

  async function sendMessage() {
    const inp = document.getElementById("user-input");
    const text = inp.value.trim();
    if (!text) return;
    inp.value = "";
    appendMessage("user", text);

    const btn = document.getElementById("send-btn");
    btn.disabled = true;
    const typing = document.createElement("div");
    typing.className = "typing";
    typing.id = "typing-indicator";
    typing.textContent = "Agent is typing...";
    document.getElementById("messages").appendChild(typing);

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message: text })
      });
      const data = await res.json();
      typing.remove();
      appendMessage("assistant", data.reply || "Error: empty reply");
      document.getElementById("debug-data").textContent = JSON.stringify(data.data, null, 2);
      document.getElementById("debug-trace").textContent = JSON.stringify(data.trace, null, 2);
    } catch (e) {
      typing.remove();
      appendMessage("assistant", "Sorry, an error occurred while connecting to the server.");
    } finally {
      btn.disabled = false;
      inp.focus();
    }
  }

  function toggleDebug() {
    const el = document.getElementById("debug-content");
    const arrow = document.getElementById("debug-toggle-arrow");
    if (el.style.display === "none") {
      el.style.display = "block";
      arrow.textContent = "▼";
    } else {
      el.style.display = "none";
      arrow.textContent = "▶";
    }
  }

  loadConfig();
</script>
</body>
</html>
